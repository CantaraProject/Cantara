# A Cantara server with its database.
#
#   cp deploy/.env.example deploy/.env      # and fill it in
#   docker compose -f deploy/docker-compose.yml up -d
#
# The server is then at http://localhost:8080 (or the port in CANTARA_PORT).
# Put a reverse proxy with TLS in front of it for anything but trying it out,
# and set CANTARA_PUBLIC_URL to the address people use.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cantara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cantara}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cantara} -d ${POSTGRES_DB:-cantara}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    image: cantara-server
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cantara}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cantara}
    ports:
      - "${CANTARA_PORT:-8080}:8080"
    # Where the files of every library are kept. A named volume by default;
    # set CANTARA_DATA to a directory on the host (`/srv/cantara`) to have
    # them there instead. Back this up together with the database.
    volumes:
      - ${CANTARA_DATA:-files}:/data
    depends_on:
      db:
        condition: service_healthy

  # An OpenID Connect provider to try logging in with, started only with
  # `--profile oidc`. Not for production: it keeps its users in memory. Its
  # admin console is at http://localhost:8081 (admin / admin); create a realm
  # `cantara`, a confidential client `cantara-server` with the redirect URI
  # `${CANTARA_PUBLIC_URL}/auth/oidc/callback`, and a user with a verified
  # e-mail address. The matching settings are commented out in .env.example.
  keycloak:
    profiles: ["oidc"]
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"

volumes:
  db:
  files:
