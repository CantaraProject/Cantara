# The presentation itself and the presenter console beside it.
#
# Every file under `locales/` is read and merged, so this one is
# reached without being registered anywhere. The version has to be a
# whole number: `2.0` is read as version 1 and the file silently
# stops working.
_version: 2
presentation:
  title:
    en: Presentation
    de: Präsentation
  # The speaker layout of a monitor view labels the smaller slide, so that
  # somebody glancing at two of them knows at once which is which.
  monitor_next:
    en: "Next"
    de: "Als Nächstes"
  monitor_end:
    en: "End of the presentation"
    de: "Ende der Präsentation"

presenter:
  title:
    en: Presenter Console
    de: Moderatorenkonsole
  remote:
    nothing_running:
      en: "No presentation is running. This page stays open; the next one appears here."
      de: "Es läuft keine Präsentation. Diese Seite bleibt offen, die nächste erscheint hier." 
  status_running:
    en: The presentation is running
    de: Die Präsentation läuft
  preview:
    en: Live Preview
    de: Live-Vorschau
  stream_preview:
    en: Network stream
    de: Netzwerk-Übertragung
  stream_copy:
    en: Copy the address for viewers
    de: Adresse für Zuschauer kopieren
  stream_copied:
    en: Copied
    de: Kopiert
  stream_copy_failed:
    en: Could not copy
    de: Konnte nicht kopiert werden
  stream_same_as_projection:
    en: The stream is showing what the projection is showing.
    de: Die Übertragung zeigt dasselbe wie die Projektion.
  chapters:
    en: Elements
    de: Elemente
  previous:
    en: Previous
    de: Zurück
  next:
    en: Next
    de: Weiter
  black_screen:
    en: Black Screen
    de: Schwarzer Bildschirm
  quit:
    en: Quit
    de: Beenden
  edit_selection:
    en: Edit Selection
    de: Auswahl bearbeiten
  empty_slide:
    en: (Empty slide)
    de: (Leere Folie)
  view_text:
    en: Text
    de: Text
  view_grid:
    en: Overview
    de: Übersicht
  grid_size:
    en: Thumbnail size
    de: Größe der Vorschaubilder
  progress:
    en: Progress through the presentation
    de: Fortschritt der Präsentation
  video:
    play:
      en: Play
      de: Abspielen
    pause:
      en: Pause
      de: Pause
    back:
      en: Back ten seconds
      de: Zehn Sekunden zurück
    forward:
      en: Forward ten seconds
      de: Zehn Sekunden vor
    position:
      en: Position in the video
      de: Position im Video
    mute:
      en: Mute
      de: Stummschalten
    volume:
      en: Volume
      de: Lautstärke
