# The selection window: putting a service together, its options per
# element, and saving or opening it as a file.
#
# Every file under `locales/` is read and merged, so this one is
# reached without being registered anywhere. The version has to be a
# whole number: `2.0` is read as version 1 and the file silently
# stops working.
_version: 2
selection:
  start_presentation:
    en: Start Presentation...
    de: Präsentation starten...
  stream_headline:
    en: Stream to the network
    de: Ins Netzwerk übertragen
  stream_description:
    en: "Stream the running presentation over the local network"
    de: "Die laufende Präsentation über das lokale Netzwerk übertragen"
  stream_enable:
    en: Stream this presentation
    de: Diese Präsentation übertragen
  stream_address_hint:
    en: "Open this address in a browser on the local network:"
    de: "Diese Adresse in einem Browser im lokalen Netzwerk öffnen:"
  stream_failed:
    en: "Streaming could not be started: %{reason}"
    de: "Die Übertragung konnte nicht gestartet werden: %{reason}"
  stream_copy_hint:
    en: Click to copy
    de: Zum Kopieren klicken
  stream_copied:
    en: Copied
    de: Kopiert
  stream_copy_failed:
    en: Could not copy — please select the address by hand.
    de: Konnte nicht kopiert werden — bitte die Adresse von Hand markieren.
  move_up:
    en: Move up
    de: Nach oben verschieben
  move_down:
    en: Move down
    de: Nach unten verschieben
  import:
    en: Import...
    de: Importieren...
  export:
    en: Export...
    de: Exportieren...
  drag_drop_hint:
    en: "Drag & drop supported files here to add them temporarily"
    de: "Unterstützte Dateien hier hineinziehen, um sie temporär hinzuzufügen"
  drag_drop_active:
    en: "Drop files here"
    de: "Dateien hier ablegen"
  drag_drop_unsupported:
    en: "Unsupported file type"
    de: "Nicht unterstützter Dateityp"
  detail_view:
    en: Detail View...
    de: Detailansicht
  presentation_options:
    tab:
      general:
        en: General
        de: Allgemein
      specific:
        en: Specific
        de: Spezifisch
    design:
      en: Presentation Design
      de: Präsentations-Design
    slide_settings:
      en: Slide Settings
      de: Folien-Einstellungen
    default:
      en: Default
      de: Standard
    select_item_first:
      en: Please select an item first.
      de: Bitte wählen Sie zuerst ein Element aus.
    stream_view:
      headline:
        en: Network stream
        de: Netzwerk-Übertragung
      description:
        en: "The stream may use a design and a slide division of its own. Leave both as they are to show the same as the projection shows."
        de: "Die Übertragung kann ein eigenes Design und eine eigene Folienaufteilung verwenden: Unverändert zeigt sie den gleichen Inhalt, der auch projiziert wird."
      design:
        en: Design for the stream
        de: Design für die Übertragung
      slide_settings:
        en: Slide settings for the stream
        de: Folien-Einstellungen für die Übertragung
      same_as_presentation:
        en: Same as the presentation
        de: Wie die Präsentation
      max_lines_note:
        en: "The line wrap follows the presentation: a streamed slide holds a whole number of the projected ones. %{chosen} becomes %{used} lines."
        de: "Der Zeilenumbruch richtet sich nach der Präsentation: Eine über das Netzwerk übertragene Folie enthält ein ganzes Vielfaches der projizierten. Aus %{chosen} werden %{used} Zeilen."
        en: "The presentation shows whole verses, so the stream does too — there is nothing for its line wrap to be a multiple of."
        de: "Die Präsentation zeigt ganze Strophen, daher tut es die Übertragung auch — es gibt nichts, wovon ihr Zeilenumbruch ein Vielfaches sein könnte."
    timer:
      label:
        en: Auto-Advance Timer (seconds)
        de: Automatischer Weiter-Timer (Sekunden)
      disabled:
        en: Disabled
        de: Deaktiviert
      after_last_slide:
        label:
          en: After last slide
          de: Nach letzter Folie
        go_to_next:
          en: Go to next chapter
          de: Zum nächsten Kapitel wechseln
        restart_chapter:
          en: Restart current chapter
          de: Aktuelles Kapitel wiederholen
    transition:
      label:
        en: Slide Transition
        de: Folien-Übergang
      none:
        en: None
        de: Kein
      fade:
        en: Fade
        de: Einblenden
      slide_from_right:
        en: Slide from right
        de: Von rechts einschieben
      slide_from_left:
        en: Slide from left
        de: Von links einschieben
      zoom_in:
        en: Zoom in
        de: Einzoomen
      morph:
        en: Morph (transform between slides)
        de: Morphen (Übergang durch Verwandlung)
  presentation_running:
    en: A presentation is currently running.
    de: Eine Präsentation läuft gerade.
  update_presentation:
    en: Update Presentation
    de: Präsentation aktualisieren
  return_to_presenter:
    en: Return to Presenter Console
    de: Zurück zur Moderatorenkonsole
  markdown:
    add_text:
      en: Add Markdown Text
      de: Markdown-Text hinzufügen
    placeholder:
      en: "Enter Markdown text here... Use --- on a new line to separate slides."
      de: "Markdown-Text hier eingeben... --- in einer neuen Zeile trennt die Folien."
    add_button:
      en: Add to Selection
      de: Zur Auswahl hinzufügen
    spontaneous_name:
      en: Markdown Text
      de: Markdown-Text
  export_dialog_title:
    en: Export
    de: Exportieren
  # What is being exported, which the dialog asks before it asks for a format.
  export_category_selection:
    en: Cantara selection
    de: Cantara-Folien
  export_category_selection_description:
    en: "The running order with everything that belongs to it, as a file to open again later or to pass on"
    de: "Die Ablaufreihenfolge mit allem, was dazugehört, als Datei zum späteren Öffnen oder Weitergeben"
  export_category_markup:
    en: Markup text
    de: Markup-Text
  export_category_markup_description:
    en: "The words of the songs as text for a service sheet, a message or a document"
    de: "Die Liedtexte als Text für einen Ablaufzettel, eine Nachricht oder ein Dokument"
  export_category_notation:
    en: Notation
    de: Notation
  export_category_notation_description:
    en: "The music as something an engraver reads. One file per song."
    de: "Die Musik in einem Notensatzformat. Eine Datei je Lied."
  export_category_powerpoint:
    en: PowerPoint
    de: Powerpoint
  export_category_powerpoint_description:
    en: "The slides as a PowerPoint deck, laid out the way the presentation would show them."
    de: "Die Folien als PowerPoint-Präsentation, so gestaltet wie in der Präsentation."
  export_format:
    en: Export Format
    de: Export-Format
  export_format_text:
    en: Plain Text
    de: Einfacher Text
  export_format_telegram:
    en: Telegram Format
    de: Telegram-Format
  export_format_markdown:
    en: Markdown
    de: Markdown
  export_format_lilypond:
    en: LilyPond (Sheet Music)
    de: LilyPond (Noten)
  export_format_abc:
    en: ABC notation (one file per song)
    de: ABC-Notation (eine Datei je Lied)
  export_error_no_songs:
    en: "No song files are selected. Pictures, PDFs and Markdown documents cannot be exported."
    de: "Es sind keine Lied-Dateien ausgewählt. Bilder, PDFs und Markdown-Dokumente können nicht exportiert werden."

  # Saving and opening the running order itself, rather than the songs in it.
  save_selection_format:
    en: Selection format
    de: Format der Auswahl
  save_selection_summary:
    en: "%{count} element(s) in the running order, %{songs} of them songs."
    de: "%{count} Element(e) in der Ablaufreihenfolge, davon %{songs} Lieder."
  save_selection_file_name:
    en: Selection
    de: Auswahl
  save_selection_songs_only:
    en: "This format is Cantara 2's and holds songs only: pictures, PDFs and Markdown documents are left out, as are the slide division and the stream settings."
    de: "Dieses Format stammt aus Cantara 2 und kennt nur Lieder: Bilder, PDFs und Markdown-Dokumente entfallen, ebenso die Folienaufteilung und die Übertragungs-Einstellungen."
  selection_format_cantara_zip:
    en: "Cantara selection (.cantara.zip): everything"
    de: "Cantara-Auswahl (.cantara.zip): alles"
  selection_format_songtex:
    en: "SongTeX (.songtex): Cantara 2, songs only"
    de: "SongTeX (.songtex): Cantara 2, nur Lieder"
  selection_format_cantara_json:
    en: "Cantara 2 selection (.json): songs only"
    de: "Cantara-2-Auswahl (.json): nur Lieder"

  import_title:
    en: Open a selection
    de: Auswahl öffnen
  import_choose_file:
    en: Choose a selection file (.cantara.zip, .songtex or .json).
    de: Wählen Sie eine Auswahl-Datei (.cantara.zip, .songtex oder .json).
  import_file_filter:
    en: Cantara selections
    de: Cantara-Auswahlen
  import_confirm:
    en: Open
    de: Öffnen
  import_summary_items:
    en: "%{count} element(s) in the running order"
    de: "%{count} Element(e) in der Ablaufreihenfolge"
  import_summary_known:
    en: "%{count} of them are already in your repositories."
    de: "%{count} davon sind bereits in Ihren Quellen vorhanden."
  import_summary_new:
    en: "%{count} come with the file and can be added to your repositories."
    de: "%{count} bringt die Datei mit und können in Ihre Quellen übernommen werden."
  import_summary_missing:
    en: "%{count} cannot be shown: they are neither in your repositories nor in the file."
    de: "%{count} können nicht angezeigt werden: Sie sind weder in Ihren Quellen noch in der Datei enthalten."
  import_summary_designs:
    en: "The file brings %{designs} presentation design(s) and %{slide_settings} slide setting(s) you do not have yet."
    de: "Die Datei bringt %{designs} Präsentationsdesign(s) und %{slide_settings} Folien-Einstellung(en) mit, die Sie noch nicht haben."
  # A file may also hold a single design or a single slide division.
  import_summary_design:
    en: "The presentation design “%{name}”"
    de: "Das Präsentationsdesign „%{name}“"
  import_summary_background:
    en: The background picture comes with it and is added to your repository
    de: Das Hintergrundbild ist enthalten und wird in Ihre Quelle übernommen
  import_summary_fonts:
    en: "%{count} font(s) come with it and are kept so the design looks right here: %{families}"
    de: "%{count} Schriftart(en) sind enthalten und werden übernommen, damit das Design hier richtig aussieht: %{families}"
  import_summary_slide_settings:
    en: "The slide settings “%{name}”"
    de: "Die Folien-Einstellungen „%{name}“"
  import_assets:
    en: Add the missing elements to my repositories
    de: Fehlende Elemente in meine Quellen übernehmen
  import_target:
    en: Add them to
    de: Übernehmen nach
  import_target_session:
    en: "Only for this session (nothing is written to your repositories)"
    de: "Nur für diese Sitzung (es wird nichts in Ihre Quellen geschrieben)"
  import_designs:
    en: Add the presentation designs and slide settings as well
    de: Präsentationsdesigns und Folien-Einstellungen ebenfalls übernehmen
  import_designs_hint:
    en: "The selection looks the way its author made it either way; this puts the designs into your settings, where you can pick and edit them."
    de: "Die Auswahl sieht ohnehin so aus, wie ihr Autor sie erstellt hat; dies fügt die Designs Ihren Einstellungen hinzu, wo Sie sie auswählen und bearbeiten können."
  import_error_empty:
    en: "There is nothing this format can hold in the selection."
    de: "Die Auswahl enthält nichts, was dieses Format aufnehmen kann."
  import_error_malformed:
    en: "The file is not a Cantara selection: %{reason}"
    de: "Die Datei ist keine Cantara-Auswahl: %{reason}"
  import_error_too_new:
    en: "The file was written by a newer version of Cantara (format %{found}, this version reads up to %{supported})."
    de: "Die Datei wurde von einer neueren Cantara-Version geschrieben (Format %{found}, diese Version liest bis %{supported})."
  import_error_archive:
    en: "The archive could not be read: %{reason}"
    de: "Das Archiv konnte nicht gelesen werden: %{reason}"
  import_error_no_target:
    en: "There is nowhere to put the missing elements: add a local folder as a repository in the settings."
    de: "Es gibt keinen Ort für die fehlenden Elemente: Fügen Sie in den Einstellungen einen lokalen Ordner als Quelle hinzu."
  export_error_unreadable:
    en: "'%{name}' could not be read: %{reason}"
    de: "„%{name}“ konnte nicht gelesen werden: %{reason}"
  export_error_unsupported:
    en: "'%{name}' is not a song format Cantara can export."
    de: "„%{name}“ ist kein Liedformat, das Cantara exportieren kann."
  export_error_unparsable:
    en: "'%{name}' could not be read as a song: %{reason}"
    de: "„%{name}“ konnte nicht als Lied gelesen werden: %{reason}"
  export_error_song_failed:
    en: "'%{title}' could not be exported: %{reason}"
    de: "„%{title}“ konnte nicht exportiert werden: %{reason}"
  export_error_render:
    en: "The export failed: %{reason}"
    de: "Der Export ist fehlgeschlagen: %{reason}"
  export_error_write:
    en: "'%{path}' could not be written: %{reason}"
    de: "„%{path}“ konnte nicht geschrieben werden: %{reason}"
  export_choose_folder:
    en: "One file is written per song, so please choose a folder."
    de: "Es wird eine Datei je Lied geschrieben, bitte einen Ordner auswählen."
  export_done:
    en: "%{count} file(s) exported."
    de: "%{count} Datei(en) exportiert."
  export_preview:
    en: Preview
    de: Vorschau
  export_copy:
    en: Copy to clipboard
    de: In die Zwischenablage kopieren
  export_copied:
    en: Copied
    de: Kopiert
  export_files_note:
    en: "%{count} files will be written, one per song. The preview shows the first."
    de: "Es werden %{count} Dateien geschrieben, eine je Lied. Die Vorschau zeigt die erste."
  export_save:
    en: Save as file...
    de: Als Datei speichern...
  export_format_handlebars:
    en: Custom template (Handlebars)
    de: Eigene Vorlage (Handlebars)
  export_format_pptx:
    en: PowerPoint presentation (.pptx)
    de: PowerPoint-Präsentation (.pptx)
  export_template:
    en: Template
    de: Vorlage
  export_template_hint:
    en: "Handlebars. Available: {{title}}, {{author}} and every tag, plus {{#each parts}}{{text}}{{/each}}"
    de: "Handlebars. Verfügbar: {{title}}, {{author}} und alle Tags, sowie {{#each parts}}{{text}}{{/each}}"
  export_pptx_note:
    en: "A PowerPoint file with %{count} slides will be written. The preview shows the deck description."
    de: "Es wird eine PowerPoint-Datei mit %{count} Folien geschrieben. Die Vorschau zeigt die Folienbeschreibung."
  export_pptx_notation_note:
    en: "%{count} slides contain notation, which PowerPoint cannot show. Their lyrics are kept."
    de: "%{count} Folien enthalten Noten, die PowerPoint nicht darstellen kann. Ihr Text bleibt erhalten."
  export_pptx_pictures_pending:
    en: "%{count} slides are pictures still being rendered. They will be included once they are ready."
    de: "%{count} Folien sind Bilder, die noch gerendert werden. Sie kommen hinzu, sobald sie fertig sind."
  export_format_pdf:
    en: PDF (coming soon)
    de: PDF (demnächst)
  export_button:
    en: Export
    de: Exportieren

search:
  en: Search...
  de: Suchen...
  results:
    en: Search Results
    de: Suchergebnisse
  result_number:
    en: "Alt+%{number}"
    de: "Alt+%{number}"
