    en: Settings
    de: Einstellungen
  close:
    en: Close
    de: Schließen
  presentation_headline:
    en: Presentation Settings
    de: Präsentationseinstellungen
  presentation_description:
    en: Setup how the presentation should look like. Click on one of the presentation designs below to adjust its settings, or create a new one.
    de: Hier kann eingestellt werden, wie die Präsentation aussehen soll. Klicken Sie dazu auf eines der Präsentationsdesigns oder legen Sie ein neues an.
  tag_mapping_headline:
    en: Tag mapping
    de: Tag-Zuordnung
  tag_mapping_description:
    en: "Songs from different collections call the same thing by different names. A rule lets Cantara read one name as another when it builds the slides — for example a song recording an \"author\" also answers to \"composer\". Nothing in your files is changed, and removing a rule undoes it."
    de: "Lieder aus verschiedenen Sammlungen benennen dasselbe unterschiedlich. Eine Regel lässt Cantara beim Erzeugen der Folien einen Namen als einen anderen lesen — ein Lied mit \"author\" antwortet dann auch auf \"composer\". An den Dateien ändert sich nichts, und das Entfernen einer Regel macht sie rückgängig."
  tag_mapping_empty:
    en: No rules yet. Songs are read exactly as their files are written.
    de: Noch keine Regeln. Lieder werden genau so gelesen, wie ihre Dateien geschrieben sind.
  tag_mapping_from:
    en: Name in the file
    de: Name in der Datei
  tag_mapping_to:
    en: Read as
    de: Gelesen als
  tag_mapping_add:
    en: Add rule
    de: Regel hinzufügen
  tag_mapping_remove:
    en: Remove rule
    de: Regel entfernen
  tag_mapping_incomplete:
    en: Both names are needed before this rule does anything.
    de: Diese Regel wirkt erst, wenn beide Namen ausgefüllt sind.
  tag_mapping_circular:
    en: A name cannot be read as itself.
    de: Ein Name kann nicht als er selbst gelesen werden.
  stream_headline:
    en: Network streaming
    de: Netzwerk-Übertragung
  stream_description:
    en: "How the running presentation is offered to browsers on the local network. Switching it on happens per presentation, in the selection window."
    de: "Wie die laufende Präsentation Browsern im lokalen Netzwerk angeboten wird. Eingeschaltet wird sie pro Präsentation im Auswahlfenster."
  stream_port:
    en: Port
    de: Port
  stream_password:
    en: Password (empty means anyone on the network can watch)
    de: Passwort (leer heißt, jeder im Netzwerk kann zusehen)
  stream_plain_http_note:
    en: "This is unencrypted HTTP on your local network. The password keeps the curious out; it is not protection from someone who is trying."
    de: "Dies ist unverschlüsseltes HTTP im lokalen Netzwerk. Das Passwort hält Neugierige ab, es schützt aber nicht vor gezielten Zugriffen."
  remote_password:
    en: Remote-control password
    de: Passwort für die Fernsteuerung
  remote_password_note:
    en: "For driving the presentation from a browser, and deliberately not the password above: that one is meant to be given out. Empty means anyone who can reach the address can drive the presentation."
    de: "Für das Steuern der Präsentation aus einem Browser — bewusst nicht das Passwort darüber, das zum Weitergeben gedacht ist. Leer heißt, dass jeder, der die Adresse erreicht, die Präsentation steuern kann."
  screen_headline:
    en: Screen Settings
    de: Bildschirmeinstellungen
  screen_description:
    en: Configure which screens to use for the presentation and the presenter console.
    de: Konfigurieren Sie, welche Bildschirme für die Präsentation und die Moderatorenkonsole verwendet werden sollen.
  show_presenter_console_title:
    en: Show Presenter Console
    de: Moderatorenkonsole anzeigen
  show_presenter_console_description:
    en: When enabled, a presenter console window opens alongside the presentation with slide text, preview, and controls.
    de: Wenn aktiviert, öffnet sich neben der Präsentation ein Fenster mit Folientext, Vorschau und Steuerung.
  presenter_console_in_main_window_title:
    en: Presenter Console in Main Window
    de: Moderatorenkonsole im Hauptfenster
  presenter_console_in_main_window_description:
    en: When enabled, the presenter console is shown in the main window instead of opening a separate window.
    de: Wenn aktiviert, wird die Moderatorenkonsole im Hauptfenster angezeigt, anstatt ein separates Fenster zu öffnen.
  detected_monitors:
    en: Detected Monitors
    de: Erkannte Bildschirme
  refresh_monitors:
