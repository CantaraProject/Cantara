# The settings page: repositories, screens, presentation designs, the
# network stream.
#
# Every file under `locales/` is read and merged, so this one is
# reached without being registered anywhere. The version has to be a
# whole number: `2.0` is read as version 1 and the file silently
# stops working.
_version: 2
settings:
  repositories_headline:
    en: Repositories
    de: Quellen
  repositories_description:
    en: |-
      Cantara loads all source files from one or multiple repositories.
      Select one or multiple Repositories where Cantara will load source files from.
      You need to select at least one repository.
    de: |-
      Cantara lädt alle Dateien aus einer oder mehreren Quellen.
      Wählen Sie eine oder mehrere Quellen aus, aus denen Cantara Quelldateien laden soll.
      Es muss mindestens eine Quelle ausgewählt sein.
  repositories_local_dir:
    en: Local directory
    de: Lokales Verzeichnis
  repositories_remote_dir:
    en: Remote directory
    de: Entferntes Verzeichnis
  add_folder:
    en: Add Folder
    de: Verzeichnis hinzufügen
  add_remote_repository:
    en: Add Remote Repository
    de: Entferntes Repository hinzufügen
  repositories_remote_zip:
