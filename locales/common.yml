# Words and sentences that belong to no one part: the name of a thing,
# a button that appears everywhere, a question a dialog asks.
#
# Every file under `locales/` is read and merged, so this one is
# reached without being registered anywhere. The version has to be a
# whole number: `2.0` is read as version 1 and the file silently
# stops working.
_version: 2
