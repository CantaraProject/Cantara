name: Build and publish Cantara

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # The dx that builds this project. Named once so that every job installs the
  # same one, and kept in step with the `dioxus` version in Cargo.toml.
  DIOXUS_CLI_VERSION: "0.7.10"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target_dir: linux
          - os: windows-latest
            target_dir: windows
          - os: macos-latest
            target_dir: macos
    steps:
      - name: Provide npm (needed for the build)
        uses: actions/setup-node@v4
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Install cargo bininstall
        uses: cargo-bins/cargo-binstall@main
      - name: Run npm install
        run: npm install
      # `--locked` is not optional here, and its absence is what broke this job.
      #
      # When the prebuilt `dx` cannot be fetched, binstall falls back to
      # building dioxus-cli from source — and without `--locked` cargo throws
      # away the version's own lockfile and resolves every dependency to the
      # newest compatible release. That is how a CI run that changed nothing
      # here started failing: `git2` 0.21 dropped `Cred::credential_helper`,
      # `auth-git2` still calls it, and dioxus-cli picked up both. Its lockfile
      # names the versions the release was built against; `--locked` is what
      # makes cargo read it.
      #
      # The version is pinned for the same reason — so that a new dioxus-cli
      # cannot arrive on its own between two runs. Keep it in step with the
      # `dioxus` version in Cargo.toml.
      - name: Install dioxus-cli (macOS)
        if: matrix.os == 'macos-latest'
        run: cargo install dioxus-cli --version ${{ env.DIOXUS_CLI_VERSION }} --locked
      - name: Install Rust LLVM tools (macOS)
        if: matrix.os == 'macos-latest'
        run: rustup component add llvm-tools-preview
      - name: Install dioxus-cli (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cargo binstall -y --locked dioxus-cli@${{ env.DIOXUS_CLI_VERSION }}
      - name: Install dioxus-cli (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo install dioxus-cli --version ${{ env.DIOXUS_CLI_VERSION }} --locked
      - name: Install dependencies under Linux
        if: matrix.os == 'ubuntu-latest'
        run: |-
          sudo apt update
          sudo apt install libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Install dependencies under Windows
        if: matrix.os == 'windows-latest'
        run: |-
          choco install openssl
      - name: Install dependencies under macOS
        if: matrix.os == 'macos-latest'
        run: |-
          brew update
          brew install openssl@3
          # Create symbolic links to the OpenSSL libraries
          sudo mkdir -p /usr/local/opt/openssl@3/lib
          sudo ln -sf $(brew --prefix openssl@3)/lib/libssl.3.dylib /usr/local/opt/openssl@3/lib/
          sudo ln -sf $(brew --prefix openssl@3)/lib/libcrypto.3.dylib /usr/local/opt/openssl@3/lib/
      - name: Run tests
        env:
          # OpenSSL environment variables
          OPENSSL_ROOT_DIR: ${{ matrix.os == 'macos-latest' && '/usr/local/opt/openssl@3' || (matrix.os == 'windows-latest' && 'C:\Program Files\OpenSSL' || (matrix.os == 'ubuntu-latest' && '/usr' || '')) }}
          OPENSSL_DIR: ${{ matrix.os == 'macos-latest' && '/usr/local/opt/openssl@3' || (matrix.os == 'windows-latest' && 'C:\Program Files\OpenSSL' || (matrix.os == 'ubuntu-latest' && '/usr' || '')) }}
          OPENSSL_LIB_DIR: ${{ matrix.os == 'windows-latest' && 'C:\Program Files\OpenSSL\lib' || (matrix.os == 'ubuntu-latest' && '/usr/lib/x86_64-linux-gnu' || '') }}
          OPENSSL_INCLUDE_DIR: ${{ matrix.os == 'windows-latest' && 'C:\Program Files\OpenSSL\include' || (matrix.os == 'ubuntu-latest' && '/usr/include' || '') }}
          DYLD_LIBRARY_PATH: ${{ matrix.os == 'macos-latest' && '/usr/local/opt/openssl@3/lib' || '' }}
        run: cargo test
      # The rule in `src/main.rs` — nothing outside the tests may `unwrap` or
      # `expect` — is a Clippy lint, and `cargo test` does not run Clippy.
      # Without this step the rule was a comment: the lint fired for anyone who
      # happened to run Clippy locally and stopped nothing at all.
      #
      # Linux only. It is the same source on all three, and one machine saying
      # so is enough; the other two are here to build what they ship.
      - name: Check the lints
        if: matrix.os == 'ubuntu-latest'
        env:
          OPENSSL_ROOT_DIR: /usr
          OPENSSL_DIR: /usr
          OPENSSL_LIB_DIR: /usr/lib/x86_64-linux-gnu
          OPENSSL_INCLUDE_DIR: /usr/include
        run: cargo clippy --all-targets -- -D warnings
      - name: Build desktop release
        env:
          # OpenSSL environment variables
          OPENSSL_ROOT_DIR: ${{ matrix.os == 'macos-latest' && '/usr/local/opt/openssl@3' || (matrix.os == 'windows-latest' && 'C:\Program Files\OpenSSL' || (matrix.os == 'ubuntu-latest' && '/usr' || '')) }}
          OPENSSL_DIR: ${{ matrix.os == 'macos-latest' && '/usr/local/opt/openssl@3' || (matrix.os == 'windows-latest' && 'C:\Program Files\OpenSSL' || (matrix.os == 'ubuntu-latest' && '/usr' || '')) }}
          OPENSSL_LIB_DIR: ${{ matrix.os == 'windows-latest' && 'C:\Program Files\OpenSSL\lib' || (matrix.os == 'ubuntu-latest' && '/usr/lib/x86_64-linux-gnu' || '') }}
          OPENSSL_INCLUDE_DIR: ${{ matrix.os == 'windows-latest' && 'C:\Program Files\OpenSSL\include' || (matrix.os == 'ubuntu-latest' && '/usr/include' || '') }}
          DYLD_LIBRARY_PATH: ${{ matrix.os == 'macos-latest' && '/usr/local/opt/openssl@3/lib' || '' }}
        run: dx build -r
      - name: Upload desktop artifact (Mac OS)
        if: matrix.os == 'macos-latest' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target_dir }}
          path: target/dx/cantara/release/macos/
      - name: Upload desktop artifact (Windows and Linux)
        if: matrix.os != 'macos-latest' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target_dir }}
          path: target/dx/cantara/release/${{ matrix.target_dir }}/app/

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: "27.0.12077973"
      ANDROID_API_LEVEL: "34"
      ANDROID_BUILD_TOOLS_VERSION: "34.0.0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Android NDK and SDK components
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "ndk;${ANDROID_NDK_VERSION}" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> $GITHUB_ENV
      - name: Install Linux system dependencies
        run: |
          sudo apt update
          sudo apt install libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Provide npm
        uses: actions/setup-node@v4
      - name: Run npm install
        run: npm install
      - name: Install cargo bininstall
        uses: cargo-bins/cargo-binstall@main
      # Pinned and `--locked`, for the reason given in the `build` job above.
      - name: Install dioxus-cli
        run: cargo binstall -y --locked dioxus-cli@${{ env.DIOXUS_CLI_VERSION }}
      - name: Add Rust Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add x86_64-linux-android
      - name: Build Android release
        run: dx build --platform android --release
      - name: Assemble APK via Gradle
        working-directory: target/dx/cantara/release/android/app
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # Android refuses to install an APK that carries no signature, and
      # `assembleRelease` on a project without a signing configuration writes
      # `app-release-unsigned.apk`. That is what the pipeline was publishing:
      # a file that builds, uploads and then cannot be installed on a phone.
      #
      # The key comes from the repository secrets when they are set. Without
      # them a key is made here so that the pipeline still produces something
      # installable — but it is a different key on every run, and Android will
      # not install an update signed by a different key than the version
      # already on the device. Set the secrets before handing builds to anyone.
      - name: Provide a signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="${RUNNER_TEMP}/cantara.jks"

          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE}"
            echo "alias=${KEY_ALIAS}" >> "$GITHUB_OUTPUT"
            echo "::add-mask::${KEYSTORE_PASSWORD}"
            echo "::add-mask::${KEY_PASSWORD}"
            echo "store_password=${KEYSTORE_PASSWORD}" >> "$GITHUB_OUTPUT"
            echo "key_password=${KEY_PASSWORD}" >> "$GITHUB_OUTPUT"
            echo "Signing with the key from the repository secrets."
          else
            GENERATED="cantara-ci-$(date +%s)"
            echo "::add-mask::${GENERATED}"
            keytool -genkeypair -v \
              -keystore "${KEYSTORE}" \
              -alias cantara \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "${GENERATED}" -keypass "${GENERATED}" \
              -dname "CN=Cantara CI, O=CantaraProject, C=DE"
            echo "alias=cantara" >> "$GITHUB_OUTPUT"
            echo "store_password=${GENERATED}" >> "$GITHUB_OUTPUT"
            echo "key_password=${GENERATED}" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret is set, so this APK is signed with a throwaway key. It installs, but it cannot be installed *over* a build signed with any other key."
          fi
          echo "keystore=${KEYSTORE}" >> "$GITHUB_OUTPUT"

      - name: Align and sign the APK
        working-directory: target/dx/cantara/release/android/app/app/build/outputs/apk/release
        env:
          KEYSTORE: ${{ steps.signing.outputs.keystore }}
          KEY_ALIAS: ${{ steps.signing.outputs.alias }}
          STORE_PASSWORD: ${{ steps.signing.outputs.store_password }}
          KEY_PASSWORD: ${{ steps.signing.outputs.key_password }}
        run: |
          set -euo pipefail
          TOOLS="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS_VERSION}"

          # Whatever Gradle called it — `app-release-unsigned.apk` without a
          # signing config, `app-release.apk` with one.
          UNSIGNED="$(ls *.apk | head -n 1)"
          echo "signing ${UNSIGNED}"

          # Alignment has to happen before signing: zipalign rewrites the
          # archive, which would invalidate a signature already in it.
          "${TOOLS}/zipalign" -p -f 4 "${UNSIGNED}" aligned.apk

          "${TOOLS}/apksigner" sign \
            --ks "${KEYSTORE}" \
            --ks-key-alias "${KEY_ALIAS}" \
            --ks-pass "pass:${STORE_PASSWORD}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out cantara-release.apk \
            aligned.apk

          rm -f aligned.apk "${UNSIGNED}"

      # The check the pipeline was missing. An APK that does not verify here is
      # one that a phone will refuse, and the job should say so rather than
      # publish it.
      - name: Verify the APK is installable
        working-directory: target/dx/cantara/release/android/app/app/build/outputs/apk/release
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS_VERSION}/apksigner" verify \
            --verbose --print-certs cantara-release.apk

      - name: Upload Android artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: target/dx/cantara/release/android/app/app/build/outputs/apk/release/cantara-release.apk
          if-no-files-found: error

  build-web:
    name: Build and deploy web (GitHub Pages)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Only associate with github-pages environment on push (empty name skips environment on PRs)
    environment:
      name: ${{ github.event_name == 'push' && 'github-pages' || '' }}
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Comma-separated list of GitHub repositories (owner/repo) to bundle with the web build.
      # These repos are cloned at build time and their song files are embedded into the WASM binary,
      # avoiding CORS issues when loading external repository resources in WebAssembly.
      CANTARA_BUNDLED_REPOS: "reckel-jm/cantara-songrepo"
    steps:
      - name: Provide npm
        uses: actions/setup-node@v4
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Clone bundled song repositories
        run: |
          IFS=',' read -ra REPOS <<< "$CANTARA_BUNDLED_REPOS"
          for repo in "${REPOS[@]}"; do
            repo=$(echo "$repo" | xargs)
            echo "Cloning https://github.com/${repo} ..."
            git clone --depth 1 "https://github.com/${repo}.git" "bundled_repos/${repo}"
          done
      - name: Run npm install
        run: npm install
      - name: Install Rust wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Install cargo bininstall
        uses: cargo-bins/cargo-binstall@main
      # Pinned and `--locked`, for the reason given in the `build` job above.
      - name: Install dioxus-cli
        run: cargo binstall -y --locked dioxus-cli@${{ env.DIOXUS_CLI_VERSION }}
      - name: Build web release
        run: dx build --platform web --release
      # GitHub Pages serves files, and Cantara's routes (/detail/<element-id>,
      # /settings, …) are not files — a visitor who opens such a link directly,
      # or reloads the page, would get the 404 page instead of the app. Pages
      # answers a missing path with 404.html, so serving the app from there as
      # well hands the URL to the router, which then opens the right view.
      - name: Serve the app for unknown paths as well
        run: cp target/dx/cantara/release/web/public/index.html target/dx/cantara/release/web/public/404.html
      - name: Setup GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v4
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/dx/cantara/release/web/public/
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        id: deployment
        uses: actions/deploy-pages@v4
