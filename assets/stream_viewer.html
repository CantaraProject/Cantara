<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Cantara</title>
<!--
  The page a phone on the network is given.

  Deliberately one file with nothing to fetch: a church hall's wi-fi is often
  the only thing between this and the internet, and often there is no internet
  at all. No framework, no fonts, no icons — the whole thing is what arrives in
  the first response.

  It renders the *words*, not a picture of the slide, so the text reflows to
  whatever it is being read on and stays sharp at any size. Pictures and PDF
  pages are the exception, and those are fetched from the server one at a time.

  What it shows is decided entirely by the state described in
  `src/logic/stream/protocol.rs`; adding the planned stage view and
  running-order sheet is a matter of drawing that same state differently.
-->
<style>
  :root {
    --background: #000;
    --foreground: #fff;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  /* The colour goes on `html` alone, and `body` stays clear.
     With it on both, `body` painted an opaque rectangle over the backdrop
     below — a background picture was fetched, drawn and then completely
     covered, which looked exactly like it never arrived. */
  html {
    background: var(--background);
  }

  /* A blank screen is black, not "the design's background with nothing on it".
     The moderator pressed the button to take the room's attention off the
     screens, and a phone still glowing in the design's colour — or worse, still
     showing the churchyard photograph the design uses — has not done that. */
  html[data-blank="yes"] {
    background: #000;
  }

  html, body {
    margin: 0;
    height: 100%;
    color: var(--foreground);
    font-family: var(--font);
    -webkit-text-size-adjust: 100%;
  }

  body {
    display: flex;
    flex-direction: column;
    /* Clear of the notch and the home indicator. */
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  main {
    /* Above the backdrop, which is what the stacking order below is for. */
    position: relative;
    z-index: 1;
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    /* Stretched, not centred. Centring each block shrink-wrapped it around
       its own text, which left the design's `text-align` with nothing to do —
       a presentation set left-aligned came out centred on the phone. The
       alignment is the design's to state, and it states it in `text_css`. */
    align-items: stretch;
    padding: 1.2rem;
    overflow-y: auto;
  }

  /* The words. Sized against the viewport so one line fills a phone held
     upright and a tablet held sideways, without either of them needing a
     setting. */
  /* One size, chosen for the screen this is being read on, and every other
     block set as a fraction of it — the fractions being the design's. The
     projection's point sizes mean nothing here, but the proportions between
     them are exactly what makes a design look like itself. */
  :root { --size: clamp(1.4rem, 5.2vw, 3rem); }

  .line {
    margin: 0;
    font-size: var(--size);
    font-family: var(--font);
    line-height: 1.25;
    overflow-wrap: anywhere;
  }

  .title {
    font-family: var(--font);
    font-size: calc(var(--size) * var(--title-scale, 1.3));
    line-height: 1.15;
    margin: 0;
  }

  /* What is coming, where the design shows it ahead. How it looks is the
     design's business, not this file's — see `applyDesign`. */
  .spoiler {
    font-size: calc(var(--size) * var(--spoiler-scale, 0.6));
  }

  .meta {
    margin: 0;
    font-size: calc(var(--size) * var(--meta-scale, 0.4));
    white-space: pre-line;
  }

  /* Everywhere but a title slide the meta line keeps out of the way in the
     bottom corner, as it does on the projection. In the flow it pushed the
     words up and read as another line of the song.
     Its own element outside `main`, because `main` is replaced wholesale on
     every slide change and this is not part of a slide. */
  #meta {
    position: fixed;
    right: calc(env(safe-area-inset-right) + 1.5em);
    bottom: calc(env(safe-area-inset-bottom) + 1em);
    z-index: 2;
    max-width: 45%;
    text-align: right;
    display: none;
  }

  #meta[data-shown="yes"] { display: block; }

  /* The staff. abcjs draws an SVG sized to the width it finds, so the box it
     is given is what decides how large it comes out — and that box is the
     design's, set inline from `notation.block_css`. */
  .notation {
    width: 100%;
    color: inherit;
  }

  .notation svg {
    width: 100%;
    height: auto;
    overflow: visible;
  }

  /* Drawn in `currentColor`, so the staff follows the design's text colour
     rather than abcjs's black — which on a dark design is invisible. */
  .notation svg path,
  .notation svg rect,
  .notation svg text,
  .notation svg tspan {
    fill: currentColor;
  }

  /* The distance the design puts between the words and the lines shown ahead.
     A minimum rather than a fixed height, as on the projection, so a long
     verse still pushes them apart rather than overlapping. */
  #gap {
    min-height: var(--block-gap, 2em);
  }

  .picture {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  /* The design's background picture, behind everything.
     Its own layer rather than a background on the body, because the design
     fades it towards the background colour and only a separate layer can carry
     that opacity without taking the words down with it — which is exactly how
  /* Nothing running, and nothing wrong. */
  .quiet {
    opacity: 0.55;
    font-size: clamp(1rem, 3.4vw, 1.4rem);
  }

  /* Says when the connection has dropped, so a viewer knows the words are old
     rather than the service having stopped. Nothing but that is ever put on
     screen: the slide is what a viewer came for, and the projection carries no
     chrome either. */
  #connection {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom) + 0.75rem);
    transform: translateX(-50%);
    padding: 0.35rem 0.9rem;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.55);
    color: #ff8a80;
    font-size: 0.8rem;
    z-index: 2;
    /* Out of the way until there is something wrong. */
    display: none;
  }

  #connection[data-state="lost"] { display: block; }

  /* Turning the sound on.
   *
   * A video is sent to a viewer as the file itself, sound and all, but it
   * arrives silent: a browser will not start a video that makes a noise
   * unless it has been asked to, and a hall in which fifty phones start
   * playing a service video by themselves is a hall nobody can hear the video
   * in. So the sound is a viewer's own decision, and this is where it is
   * made — which matters most for the viewer who is not in the hall at all,
   * watching at home, for whom a silent video is not a video.
   *
   * Only on screen while a video is up. The slide is what a viewer came for,
   * and the projection carries no chrome either. */
  #sound {
    position: fixed;
    right: calc(env(safe-area-inset-right) + 0.75rem);
    bottom: calc(env(safe-area-inset-bottom) + 0.75rem);
    display: none;
    align-items: center;
    gap: 0.4rem;
    padding: 0.5rem 0.9rem;
    border: none;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.55);
    color: var(--foreground);
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    line-height: 1;
    /* Large enough to hit with a thumb without looking. */
    min-height: 2.5rem;
    cursor: pointer;
    z-index: 3;
  }

  #sound[data-shown="yes"] { display: inline-flex; }

  /* Once the sound is on, the button has said what it had to say and gets out
     of the way — it is still there to turn it off again. */
  #sound[data-sound="on"] {
    opacity: 0.35;
    background: rgba(0, 0, 0, 0.4);
  }

  #sound[data-sound="on"]:hover,
  #sound[data-sound="on"]:focus-visible {
    opacity: 1;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
    width: min(20rem, 100%);
  }

  input, button {
    font: inherit;
    padding: 0.7rem 0.9rem;
    border-radius: 0.5rem;
    border: 1px solid currentColor;
    background: transparent;
    color: inherit;
  }

  button { cursor: pointer; font-weight: 600; }

  #error { color: #ff8a80; min-height: 1.2em; font-size: 0.9rem; }
</style>
<!--
  The stylesheets of the components that drew the slide, put in by the server.

  What arrives from Cantara is markup produced by the very same components the
  projector draws with, and those components' rules live in Cantara's own
  stylesheets. Without them the slide arrives correct and unstyled — which was
  the difference between "the same as the projection" and "a wall of text".

  Compiled into the server rather than fetched: the network this page arrives
  on frequently has no way out, and one document that is styled or does not
  build beats a second request that may not be answered.
-->
<style>/*CANTARA_COMPONENT_STYLES*/</style>
</head>
<body>
<main id="stage"><p class="quiet">…</p></main>
<div id="connection"></div>
<button id="sound" type="button" data-sound="off"></button>

<script>
(function () {
  'use strict';

  var stage = document.getElementById('stage');
  var connection = document.getElementById('connection');

  // The last state drawn, so an update saying the same thing is ignored rather
  // than redrawing the page under someone's eyes.
  // Which view this page is showing, put in by the server when it served the
  // address this page was opened at. Sent back with every request, so that two
  // addresses on one socket are two views rather than two ways to the same
  // slides.
  var viewId = 'CANTARA_VIEW_ID';
  var viewQuery = viewId ? '?view=' + encodeURIComponent(viewId) : '';

  var drawnRevision = -1;
  var source = null;

  // What the design says each kind of block should look like, kept from one
  // update to the next so a block can be dressed as it is built.


  function text(tag, className, value) {
    var element = document.createElement(tag);
    if (className) element.className = className;
    element.textContent = value;
    return element;
  }

  function show(nodes) {
    stage.replaceChildren.apply(stage, nodes);
  }

  // ── The staff ────────────────────────────────────────────────────────────
  //
  // The engraver is fetched from Cantara itself, not from the internet: the
  // network this page arrives on frequently has no way out. It is fetched the
  // first time a slide has a staff on it and never again — most services have
  // no notation at all, and half a megabyte in front of the first slide would
  // be paid for by all of them.

  var abcjsLoading = null;

  function engraver() {
    if (window.ABCJS) return Promise.resolve(window.ABCJS);
    if (!abcjsLoading) {
      abcjsLoading = new Promise(function (resolve, reject) {
        var script = document.createElement('script');
        script.src = 'abcjs.js';
        script.onload = function () { resolve(window.ABCJS); };
        script.onerror = function () {
          // Let the next slide try again rather than remembering the failure.
          abcjsLoading = null;
          reject(new Error('the engraver could not be fetched'));
        };
        document.head.appendChild(script);
      });
    }
    return abcjsLoading;
  }

  /// Engraves every staff in the rendering that has not been engraved yet.
  //
  // The block, its size and its place among the words all arrive in the
  // markup — Cantara drew them. What is left is the engraving itself, which
  // is abcjs's job here exactly as it is in Cantara's own window, and the
  // source to engrave from travels in `data-abc`.
  function engraveStaves() {
    var blocks = stage.querySelectorAll('.abc-notation-container[data-abc]:not([data-engraved])');
    if (!blocks.length) return;

    blocks.forEach(function (block) {
      // Marked before the engraver is even fetched, so that a second update
      // arriving while it is on its way does not start the same staff twice.
      block.setAttribute('data-engraved', 'yes');
      var abc = block.getAttribute('data-abc');
      var vocalFont = block.getAttribute('data-vocal-font') || '';

      engraver().then(function (ABCJS) {
        // Two frames, so the browser has laid the block out: abcjs sizes the
        // staff to the width it finds, and a width of nothing gives a staff
        // drawn to a fallback size that has nothing to do with the screen.
        return new Promise(function (resolve) {
          requestAnimationFrame(function () {
            requestAnimationFrame(function () { resolve(ABCJS); });
          });
        });
      }).then(function (ABCJS) {
        // The slide may have moved on while the engraver was being fetched.
        if (!block.isConnected) return;
        ABCJS.renderAbc(block, abc, {
          responsive: 'resize',
          paddingtop: 0,
          paddingbottom: 0,
          paddingleft: 0,
          paddingright: 0,
          staffwidth: block.clientWidth > 0 ? block.clientWidth : 700,
          format: {
            // abcjs only honours this as a "family size" string; an object is
            // silently ignored and the words stay at its unreadable default.
            vocalfont: vocalFont,
            // Engraving convention leaves the last system short. On a slide
            // that reads as a mistake, so it is stretched like the others.
            stretchlast: 1
          }
        });
        // abcjs writes black into the SVG; the design may well be light on dark.
        block.querySelectorAll('path, rect, text, tspan').forEach(function (node) {
          if (node.getAttribute('fill') !== 'none') {
            node.setAttribute('fill', 'currentColor');
          }
          if (node.getAttribute('stroke') && node.getAttribute('stroke') !== 'none') {
            node.setAttribute('stroke', 'currentColor');
          }
        });
      }).catch(function (error) {
        // An empty staff is less disruptive than a wall of raw ABC source, and
        // the words are on the slide either way.
        block.setAttribute('data-notation-error', String(error && error.message));
      });
    });
  }

  // ── The password, when there is one ──────────────────────────────────────

  function askForPassword() {
    var form = document.createElement('form');
    var field = document.createElement('input');
    field.type = 'password';
    field.placeholder = 'Password';
    field.autocomplete = 'current-password';
    var submit = document.createElement('button');
    submit.type = 'submit';
    submit.textContent = 'Watch';
    var error = text('p', '', '');
    error.id = 'error';

    form.append(field, submit, error);
    show([text('p', 'quiet', 'This presentation is protected.'), form]);
    field.focus();

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      submit.disabled = true;
      error.textContent = '';
      fetch('login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: field.value })
      }).then(function (response) {
        submit.disabled = false;
        if (response.ok) {
          start();
        } else {
          error.textContent = 'That is not the password.';
          field.select();
        }
      }).catch(function () {
        submit.disabled = false;
        error.textContent = 'Cantara cannot be reached.';
      });
    });
  }

  // ── Drawing a state ──────────────────────────────────────────────────────

  // The meta line, in the corner it keeps on every slide but a title.
  // The video element that is on screen, if the slide that is up is a video.
  // Kept so that an update can adjust it instead of replacing it — replacing
  // would restart the download and the playback, and updates arrive several
  // times a second.
  var currentVideo = null;
  // What the presentation last said about it.
  var videoState = null;

  // Whether this viewer has asked for the sound.
  //
  // Off until they do, and forgotten on a reload. Not remembered on purpose: a
  // browser only lets a video make a noise once the page has been touched, and
  // a page that came back from a reload has not been touched yet. Starting a
  // video unmuted then does not give a silent viewer their sound — it stops
  // the video, which is worse than the thing being fixed.
  var soundWanted = false;
  var soundButton = document.getElementById('sound');

  function drawSoundButton() {
    soundButton.dataset.sound = soundWanted ? 'on' : 'off';
    soundButton.textContent = soundWanted ? '🔊 Sound on' : '🔇 Tap for sound';
    soundButton.setAttribute(
      'aria-label',
      soundWanted ? 'Turn the sound off' : 'Turn the sound on'
    );
  }

  function showSoundButton(shown) {
    soundButton.dataset.shown = shown ? 'yes' : 'no';
  }

  soundButton.addEventListener('click', function () {
    soundWanted = !soundWanted;
    drawSoundButton();
    if (!currentVideo) { return; }

    var element = currentVideo;
    element.muted = !soundWanted;
    // The tap is what a browser was waiting for, so a video that would not
    // start before may start now.
    applyVideoState();

    // And a browser that takes the video back to the beginning is put back
    // where the service is.
    //
    // Turning the sound on is the first moment the audio track matters, and
    // some browsers pick it up by loading the file again — which lands at
    // nought and looks exactly like the video starting over. The presentation's
    // position is the truth either way, so it is applied again for a few
    // seconds afterwards: the reload does not always begin in the same breath
    // as the tap, and waiting for the next update from the presentation would
    // leave the beginning of the video on screen in the meantime.
    var until = Date.now() + 3000;
    (function keepPlace() {
      if (element !== currentVideo || !element.isConnected) { return; }
      applyVideoState();
      if (Date.now() < until) { setTimeout(keepPlace, 100); }
    })();
  });

  drawSoundButton();

  // How far a viewer may drift from the presentation before being pulled back,
  // in seconds.
  //
  // Not zero, and not small: the position travels over a network and a phone
  // decodes at its own pace, so some difference is permanent and normal.
  // Correcting it constantly would stutter the picture on every update. Half a
  // second is close enough that nobody in the room can tell the phone from the
  // wall, and loose enough to leave an untroubled playback alone.
  var VIDEO_DRIFT = 0.5;

  function applyVideoState() {
    if (!currentVideo || !videoState) { return; }

    if (Math.abs(currentVideo.currentTime - videoState.position) > VIDEO_DRIFT) {
      currentVideo.currentTime = videoState.position;
    }

    if (videoState.playing) {
      if (currentVideo.paused) {
        // A browser refuses to play unprompted unless the video is muted, and
        // a video nobody has asked for the sound of is. Where it refuses
        // anyway — some phones want a tap first — the refusal is swallowed
        // rather than thrown, and the next update tries again.
        var element = currentVideo;
        var started = element.play();
        if (started) {
          started.catch(function () {
            // Asked to play with the sound on and refused: this browser wants
            // a fresh tap for that, and there is nothing here that can give it
            // one. The picture is what matters more, so it goes back to
            // silent and the button offers the sound again.
            if (!element.muted) {
              element.muted = true;
              soundWanted = false;
              drawSoundButton();
              var again = element.play();
              if (again) { again.catch(function () {}); }
            }
          });
        }
      }
    } else if (!currentVideo.paused) {
      currentVideo.pause();
    }
  }

  function draw(state) {
    drawStage(state);

    // What is on the stage is what says whether a video is up: every branch of
    // `drawStage` replaces the stage's contents, so an element that is no
    // longer in it has been left behind. Forgetting it here is what lets the
    // same video be shown again later — it used to be remembered, found to be
    // "already the one on screen", and never put back on the stage, so
    // returning to a video slide showed the slide before it.
    if (currentVideo && !currentVideo.isConnected) {
      currentVideo = null;
    }
    showSoundButton(!!currentVideo);
  }

  // What was last put on the stage, so that an update which changes nothing
  // about the slide — a video moving, several times a second — does not
  // rebuild it. Rebuilding would restart the video download on every tick.
  var drawnHtml = null;

  function drawStage(state) {
    videoState = state.video || null;
    document.documentElement.dataset.blank = state.blacked_out ? 'yes' : 'no';

    if (!state.running) {
      drawnHtml = null;
      currentVideo = null;
      show([text('p', 'quiet', 'Waiting for the presentation to begin…')]);
      return;
    }

    // Cantara draws the slide — the same components that draw it on the
    // projector — and sends the markup. Nothing here decides what a slide
    // looks like any more; see `crate::components::stream_render`.
    var html = state.html || '';
    if (!html) {
      drawnHtml = null;
      currentVideo = null;
      show([text('p', 'quiet', '…')]);
      return;
    }

    if (html !== drawnHtml) {
      // A clock ticking is not a slide change.
      //
      // A monitor view carrying a clock or a timer is re-rendered once a
      // second, so the markup differs every second — but only inside the
      // widgets. Rebuilding the stage for that tore down and rebuilt
      // everything on it every second: the slide frames were re-created and
      // so lost the size they had been fitted to (a visible jump back to
      // unscaled, once a second), the video element was replaced and started
      // again, and every staff was engraved afresh.
      //
      // So where the two differ *only* in what the widgets say, the widgets
      // are the only thing replaced.
      if (drawnHtml && onlyWidgetsDiffer(drawnHtml, html)) {
        patchWidgets(html);
      } else {
        var playing = currentVideo;
        stage.innerHTML = html;
        currentVideo = adoptVideo(playing);
        engraveStaves();
        fitSlides();
      }
      drawnHtml = html;
    }

    applyVideoState();
  }

  // The markup with the widgets emptied, for comparing two renderings by
  // everything *except* what the widgets say.
  function withoutWidgetText(markup) {
    var box = document.createElement('div');
    box.innerHTML = markup;
    box.querySelectorAll('.monitor-widget').forEach(function (widget) {
      widget.textContent = '';
    });
    return box.innerHTML;
  }

  // Whether two renderings are the same slide with a different time on it.
  function onlyWidgetsDiffer(before, after) {
    if (after.indexOf('monitor-widget') === -1) return false;
    return withoutWidgetText(before) === withoutWidgetText(after);
  }

  // Replaces what the widgets say, and nothing else.
  //
  // Nothing moves, so nothing has to be measured or engraved again and the
  // video is not touched — which is the whole point of coming here rather
  // than rebuilding the stage.
  function patchWidgets(markup) {
    var box = document.createElement('div');
    box.innerHTML = markup;
    var fresh = box.querySelectorAll('.monitor-widget');
    var live = stage.querySelectorAll('.monitor-widget');
    // Only where they line up. They always do — the two renderings were just
    // compared and found equal apart from these — but a mismatch would mean
    // putting one widget's words into another, and a full rebuild is the
    // honest answer to a surprise.
    if (fresh.length !== live.length) {
      stage.innerHTML = markup;
      currentVideo = adoptVideo(currentVideo);
      engraveStaves();
      fitSlides();
      return;
    }
    for (var index = 0; index < live.length; index++) {
      live[index].innerHTML = fresh[index].innerHTML;
    }
  }

  // Keeps a video playing across an update that redraws the stage.
  //
  // The markup arrives with a fresh `<video>` in it. Using that one would
  // restart the download and the playback every time the slide is redrawn,
  // and a viewer would never get past the first second. So where the new
  // markup asks for the same file that is already playing, the element that
  // is already playing is put back in its place.
  function adoptVideo(playing) {
    var fresh = stage.querySelector('video');
    if (!fresh) return null;

    // Silent unless this viewer has asked for the sound. A hall in which
    // every phone plays the sound by itself is a hall nobody can hear the
    // video in — and a browser would not have started it unprompted anyway.
    fresh.muted = !soundWanted;
    fresh.playsInline = true;

    if (playing && playing.getAttribute('src') === fresh.getAttribute('src')) {
      fresh.replaceWith(playing);
      playing.muted = !soundWanted;
      return playing;
    }

    // Whenever the element loads the file it starts at the beginning, which is
    // not where the service is. This is what puts it back without waiting for
    // the next update to notice.
    fresh.addEventListener('loadedmetadata', applyVideoState);
    return fresh;
  }

  // Fits any slide the rendering carries into the box it was given.
  //
  // The script is Cantara's own, put in by the server; running it is all this
  // page does. Guarded so that a page with no slide frames — the ordinary
  // audience stream — costs nothing.
  function fitSlides() {
    if (!stage.querySelector('.monitor-slide-frame')) return;
    /*CANTARA_SLIDE_SCALE*/
  }

  // A phone turned on its side is a different box, and the slide in it has to
  // be measured again. The script watches each frame, but a frame replaced by
  // the next state has to be picked up too — so this is asked for on the
  // window's own events as well, which costs nothing when there is no slide.
  window.addEventListener('resize', fitSlides);
  window.addEventListener('orientationchange', fitSlides);

  // ── Staying connected ────────────────────────────────────────────────────

  function setConnection(state) {
    connection.dataset.state = state;
    connection.textContent = state === 'lost' ? 'Reconnecting…' : '';
  }

  function start() {
    if (source) source.close();
    setConnection('opening');

    source = new EventSource('events' + viewQuery);

    source.addEventListener('open', function () {
      setConnection('open');
    });

    source.addEventListener('message', function (event) {
      var state;
      try {
        state = JSON.parse(event.data);
      } catch (e) {
        return;
      }
      setConnection('open');
      if (state.revision === drawnRevision) return;
      drawnRevision = state.revision;
      draw(state);
    });

    source.addEventListener('error', function () {
      // `EventSource` reconnects by itself, so this only has to say so. The
      // exception is a password: the stream is refused outright, and no amount
      // of retrying will help.
      setConnection('lost');
      fetch('state' + viewQuery).then(function (response) {
        if (response.status === 401) {
          source.close();
          source = null;
          setConnection('open');
          askForPassword();
        }
      }).catch(function () { /* still offline; EventSource keeps trying */ });
    });
  }

  // Find out whether a password is wanted before opening the stream, so a
  // protected presentation asks once rather than flickering through an error.
  fetch('state' + viewQuery)
    .then(function (response) {
      if (response.status === 401) {
        askForPassword();
        return;
      }
      start();
    })
    .catch(function () {
      show([text('p', 'quiet', 'Cantara cannot be reached.')]);
    });
})();
</script>
</body>
</html>
