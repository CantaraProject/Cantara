[package]
name = "cantara"
version = "0.3.0"
authors = ["Jan Martin Reckel <jm.reckel@t-online.de>"]
keywords = ["music", "sheets", "presentation"]
license-file = "COPYING"
description = "Software for Song Presentation in Churches"
edition = "2024"
repository = "https://github.com/CantaraProject/Cantara"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.9", features = ["router"] }
dirs = "6.0.0"

# Animated route transitions. The platform backend (`web` vs. `desktop`) is
# selected through Cantara's own platform features below, since the crate's
# default (`web`) would pull in wasm-bindgen on native builds.
dioxus-motion = { version = "0.3.5", default-features = false, features = ["transitions"] }

dioxus-free-icons = { version = "0.10.0", features = [
    "font-awesome-regular",
    "font-awesome-solid",
] }

rust-i18n = "4.2.1"
serde = "1.0.228"
serde_json = "1.0.145"
uuid = { version = "1", features = ["v4", "serde"] }
sys-locale = "=0.3.2"

# Cantara libraries
cantara-songlib = "0.3.0"
markdown = "1.0.0"
rgb = { version = "0.8.52", features = ["serde"] }
# Decodes the pictures of a library so they can be scaled down to list
# thumbnails; `png` is also what the window icon is loaded from.
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg"] }
log = "0.4.28"
# reqwest without default TLS on all targets; TLS and blocking added for non-WASM below
# On WASM, the browser's native fetch API handles HTTP/TLS natively
reqwest = { version = "0.13.2", default-features = false, features = ["json"] }
zip = "8.1.0"
regex = "1.12.3"
md5 = "0.8.0"
fuzzy-matcher = "0.3.7"
# Hands a dialog's answer back to the code that opened it. Already in the tree —
# Dioxus builds on it — and it is what lets an in-app dialog be awaited the way
# the browser's blocking `confirm()` used to be. MIT OR Apache-2.0.
futures-channel = "0.3"

# Non-Linux desktop dependencies (macOS, Windows, etc. – excluded from Android, iOS, and web/WASM)
[target.'cfg(not(any(target_os = "linux", target_os = "android", target_os = "ios", target_arch = "wasm32")))'.dependencies]
rfd = { version = "0.17.2", default-features = false }
dark-light = "2.0"
lopdf = "0.44.0"
base64 = "0.22.1"

# Linux desktop dependencies (same libraries, with xdg-portal support for rfd)
[target.'cfg(all(target_os = "linux", not(target_arch = "wasm32")))'.dependencies]
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
dark-light = "2.0"
lopdf = "0.44.0"
base64 = "0.23.0"

# Non-WASM dependencies (blocking HTTP client, TLS, and filesystem helpers not available on WASM)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The server that offers a running presentation to browsers on the local
# network. Both are already in the tree — Dioxus builds on them — so this adds
# no compilation and no licence beyond what is here (MIT, as is tokio).
# There is no server inside a browser, hence non-WASM only.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
# One stream adaptor, for turning "the state changed" into server-sent events.
# Also already in the tree, and dual MIT/Apache-2.0.
futures-util = { version = "0.3", default-features = false }
# Lists this machine's network addresses, so the address shown for streaming is
# one another device can actually reach. Asking the routing table alone is not
# enough: a hall network with no route to the internet answers "nowhere", and
# what was then shown was `localhost`. MIT OR Apache-2.0.
local-ip-address = "0.6"
# Enumerates the installed system fonts so they can be offered in the settings.
# `fs` is enough — the font data itself is never needed, only the family names.
fontdb = { version = "0.24", default-features = false, features = ["fs"] }
reqwest = { version = "0.13.2", features = ["blocking", "default-tls"] }
tempfile = "3.23"
dioxus-liveview = { version = "0.7", features = ["axum"] }

# Mobile (Android, iOS) dependencies: PDF, encoding, and TLS libraries
#
# reqwest's `default-tls` feature enables `rustls-platform-verifier`, which on Android
# performs certificate verification via JNI through a Java helper class
# (`rustls-platform-verifier-android`). Dioxus-built APKs don't bundle this class,
# so the JNI class-load fails with a fatal SIGABRT on any HTTPS request.
#
# Certificate verification uses embedded Mozilla root certificates (webpki-root-certs)
# via `use_preconfigured_tls()` instead of the platform verifier.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
lopdf = "0.44.0"
base64 = "0.23.1"
rustls = { version = "0.23", default-features = false, features = ["std"] }
webpki-root-certs = "1.0"

# Android-specific dependencies: JNI for accessing the app's internal data directory
# (needed because the `dirs` crate cannot resolve paths without HOME/XDG env vars on Android)
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
ndk-context = "0.1"

# Web (WASM) specific dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage", "Location"] }
lopdf = { version = "0.44.0", default-features = false }
base64 = "0.23.0"
# getrandom needs wasm_js feature to use browser's crypto API on WASM
# Both v0.3 and v0.4 are needed because transitive deps use different major versions:
# lopdf -> rand -> rand_core -> getrandom 0.3, zip -> getrandom 0.4
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_0_4 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }
# Timers for the polls that watch for background work to land. Already in the
# tree — wasm-bindgen-futures builds on it — so this adds no compilation, and
# it replaces a `setTimeout` evaluated in the page on every tick.
gloo-timers = { version = "0.3", features = ["futures"] }

[features]
default = ["desktop"]
web = ["dioxus/web", "dioxus-motion/web"]
desktop = [
    "dioxus/desktop",
    "dep:image",
    "dioxus-motion/desktop",
]
# dioxus-motion has no dedicated mobile backend; its `desktop` feature is the
# native (non-WASM) timing backend and is what mobile builds need as well.
mobile = ["dioxus/mobile", "dioxus-motion/desktop"]

[profile]

[profile.dev]
debug = "line-tables-only"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[profile.release]
opt-level = "z"
debug = false
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false

# Renders a component to a string without a window, so that a test can assert
# what a slide actually looks like — and, in particular, that it changes when
# the design does. See the reactivity tests in
# `components::presentation_components`. Same family and licence as the rest of
# Dioxus, and test-only.
[dev-dependencies]
dioxus-ssr = "0.7"
